name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm install
    
    - name: Add Android platform
      run: npx cap add android || true
    
    - name: Sync Android project
      run: npx cap sync android
    
    - name: Force Landscape Orientation in AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          # Replace any existing orientation with landscape (not sensorLandscape to avoid rotation issues)
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' "$MANIFEST"
          # If no screenOrientation attribute exists, add it to the MainActivity
          if ! grep -q "android:screenOrientation" "$MANIFEST"; then
            sed -i 's/<activity /\0android:screenOrientation="landscape" /g' "$MANIFEST"
          fi
          # Add configChanges to handle orientation changes without recreating activity
          if ! grep -q "android:configChanges" "$MANIFEST"; then
            sed -i '/android:screenOrientation/a\            android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"' "$MANIFEST"
          else
            sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"/g' "$MANIFEST"
          fi
          echo "=== AndroidManifest.xml content ==="
          cat "$MANIFEST"
          echo "=== Landscape orientation locked ==="
        fi
    
    - name: Build APK
      working-directory: android
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hehe-snake-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.2.${{ github.run_number }}
        name: Hehe FPS v3.2.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
